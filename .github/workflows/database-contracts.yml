name: Database Contract Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase migration up
        continue-on-error: false

      - name: Run contract tests
        run: npm run test:contracts

      - name: Stop Supabase
        if: always()
        run: |
          # Only stop if Supabase CLI is available and Supabase was started
          if command -v supabase &>/dev/null && supabase status &>/dev/null; then
            echo "Stopping Supabase..."
            supabase stop || true
          else
            echo "Supabase not running or CLI not available, skipping stop"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            tests/contracts/*.sql
          retention-days: 7
